[project]
authors = ["Mikhail Tavarez <miktavarez@gmail.com>"]
channels = ["https://repo.prefix.dev/mojo-community", "conda-forge", "https://conda.modular.com/max"]
description = "Structured Logger! Inspired by charmbracelet's `log` package and the Python `structlog` package."
name = "stump"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
tests = "bash scripts/tests.sh"
examples = "bash scripts/examples.sh"
benchmarks = "bash scripts/benchmarks.sh"
build = "rattler-build build -r src -c https://conda.modular.com/max -c conda-forge -c https://repo.prefix.dev/mojo-community --skip-existing=all"
publish = { cmd = "bash scripts/publish.sh", env = { PREFIX_API_KEY = "$PREFIX_API_KEY" } }

[dependencies]
max = ">=24.5.0,<25"
gojo = ">=0.1.9,<0.2"
mist = ">=0.1.4,<0.2"
small_time = ">=0.1.3,<0.2"
