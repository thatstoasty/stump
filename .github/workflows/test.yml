name: Run Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        include:
          - { target: linux-64, os: ubuntu-latest }
          - { target: osx-arm64, os: macos-latest }
          - { target: linux-aarch64, os: ubuntu-24.04-arm }
      fail-fast: false

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      # Pinned deliberately, from both ends. pixi.lock is format v7, which
      # needs pixi >=0.68.0 to read, and emberjson and mist declare
      # `pixi-build-mojo 0.1.*`, which has no viable pixi-build-api-version
      # under pixi >=0.71. Regenerating the lockfile with a newer pixi will
      # need this raised, and the dependency backends resolved first.
      - uses: prefix-dev/setup-pixi@v0.8.10
        with:
          pixi-version: v0.70.2

      - name: Run tests
        run: |
          pixi run tests
          pixi run examples
