name: Test README Examples

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # `latest` cannot build this workspace: emberjson and mist declare
      # `pixi-build-mojo 0.1.*`, which has no viable pixi-build-api-version
      # under pixi >=0.71, and >=0.73 rejects the lockfile before that. Keep
      # this in step with the pin in test.yml.
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.10
        with:
          pixi-version: v0.70.2
          cache: true

      - name: Try Building The Package
        run: pixi build
